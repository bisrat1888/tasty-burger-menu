<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasty Burger · 3D Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+Ethiopic:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#a31919;--bg2:#5e0a0a;--card:rgba(255,255,255,.12);--fg:#fff7e6;--ac:#ffc928;--mut:#f3c9b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#7d1010;--bg2:#400606}}
:root[data-theme="dark"]{--bg:#7d1010;--bg2:#400606}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(var(--bg),var(--bg2)) fixed;color:var(--fg);font-family:'Noto Sans Ethiopic',system-ui,sans-serif}
html{height:100%}
.brand{font-family:'Baloo 2',cursive;color:var(--ac);text-shadow:0 3px 0 #7a0c0c,0 8px 20px rgba(0,0,0,.4)}
#hero{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;padding:calc(5vh + env(safe-area-inset-top,0px)) 20px calc(5vh + env(safe-area-inset-bottom,0px));text-align:center}
#hero small{font-size:18px;color:var(--mut)}
#hero h1{margin:0;font-size:clamp(46px,15vw,80px);line-height:1}
#hero h2{margin:6px 0 0;font-size:22px;font-weight:700}
#hst{position:absolute;inset:0;z-index:0;overflow:hidden}
#hst img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,640px);height:auto;max-height:100%;object-fit:cover;object-position:50% 100%;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20%,#000 80%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 20%,#000 80%,transparent 100%);animation:kb 1.8s cubic-bezier(.2,.7,.2,1) both}
@keyframes kb{from{transform:translateX(-50%) scale(1.08);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){#hst img{animation:none}}
#hero>div:first-child,#hero>.btn{position:relative;z-index:1}
#hero>div:first-child{pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.45)}
#hero{justify-content:space-between}
.cvs{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.btn{border:0;background:var(--ac);color:#5e0a0a;font:700 18px 'Noto Sans Ethiopic',sans-serif;padding:14px 34px;border-radius:40px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.btn:active{transform:scale(.97)}
#menu{display:none;position:relative;z-index:1;max-width:560px;margin:0 auto;padding-bottom:30px}
#menu header{text-align:center;padding:22px 16px 8px}
#menu header h1{margin:0;font-size:44px}
#menu header p{margin:2px 0;color:var(--mut)}
#tabs{position:sticky;top:0;z-index:3;display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:linear-gradient(var(--bg),transparent)}
#tabs button{border:2px solid var(--ac);background:none;color:var(--ac);font:700 14px 'Noto Sans Ethiopic',sans-serif;padding:8px 14px;border-radius:24px;white-space:nowrap}
#tabs button.on{background:var(--ac);color:#5e0a0a}
#list{padding:6px 14px;display:grid;gap:10px}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid rgba(255,201,40,.25);backdrop-filter:blur(6px);border-radius:16px;padding:14px;cursor:pointer}
.it:active{background:rgba(255,255,255,.2)}
.it .ic{font-size:26px}
.it .nm{flex:1;font-weight:700}
.it .nm i{display:block;font-style:normal;font-weight:400;font-size:12px;color:var(--mut)}
.it b{color:var(--ac);font-size:17px;white-space:nowrap}
footer{text-align:center;margin:24px 14px 0;padding:18px;border-radius:18px;border:2px dashed var(--ac)}
footer a{color:var(--ac);font-weight:700;font-size:20px;text-decoration:none}
footer p{margin:6px 0}
#sheet{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;background:radial-gradient(120% 80% at 50% 30%,#b52020,#3a0505 85%)}
#sheet.on{display:flex}
#stage{flex:1;min-height:0;touch-action:none;position:relative}
#x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.4);color:#fff;font-size:20px;z-index:3}
#zb{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;border:0;border-radius:24px;background:var(--ac);color:#5e0a0a;font:700 14px 'Noto Sans Ethiopic',sans-serif;padding:11px 16px;z-index:3}
#hint{position:absolute;bottom:8px;width:100%;text-align:center;font-size:12px;color:var(--mut);pointer-events:none;z-index:3}
#panel{padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#3a0505 22%);min-height:200px}
#panel h2{margin:0;font-size:26px}
#sp{color:var(--ac);font-weight:800;font-size:22px}
#sc{color:var(--mut);font-size:13px;margin-left:8px}
#chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;opacity:0;transform:translateY(14px);transition:.4s}
.zin #chips{opacity:1;transform:none}
#chips span{background:var(--ac);color:#5e0a0a;font-weight:700;font-size:13px;padding:6px 12px;border-radius:20px}
#ct{margin-top:10px;font-size:12px;color:var(--mut)}
.zin #ct{display:none}
.sh #menu{visibility:hidden}
@media (prefers-reduced-motion:reduce){#chips{transition:none}}

/* ቪዲዮ ማሳያ */
#v360{position:absolute;inset:0;display:none;place-items:center;padding:70px 12px 34px;z-index:1}
.v #v360{display:grid}.v .cvs{display:none}.v #zb{display:none}
#v360 food-viewer{width:100%;max-width:720px;border-radius:22px;box-shadow:0 14px 40px rgba(0,0,0,.45);
 --fv-bg:#202228;--fv-accent:#ffc928;--fv-mask:radial-gradient(ellipse 66% 66% at 50% 50%,#000 70%,transparent 100%)}
</style>
</head>

        /* የቁጥጥር መስመር: ማጉላት · ፍጥነት · አጫውት/አቁም */
        .bar { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex;
               align-items: center; gap: 8px; padding: 5px 8px; border-radius: 999px;
               background: #000b; color: #fff; font: 500 11px system-ui, sans-serif; }
        .bar button { flex: none; width: 36px; height: 36px; border: 0; border-radius: 50%;
                      background: #ffffff22; color: #fff; font-size: 18px; line-height: 1; cursor: pointer; }
        .bar button:active { background: #ffffff44; }
        .bar button:focus-visible, .bar input:focus-visible { outline: 3px solid var(--fv-accent, #f2c14e); }
        .bar input { flex: 1; min-width: 50px; accent-color: var(--fv-accent, #f2c14e); }
        .bar.compact { left: 50%; right: auto; transform: translateX(-50%); }
        .bar .sep { width: 1px; height: 22px; background: #ffffff33; }
      </style>
      <div class="stage" tabindex="0" role="img"><div class="wrap"></div></div>
      <div class="loader"><div style="text-align:center">Loading views
        <div class="meter"><i></i></div></div></div>
      <div class="hint">Drag to rotate · pinch to zoom</div>
      <div class="bar">
        <button type="button" class="zout" aria-label="Zoom out">−</button>
        <button type="button" class="zin" aria-label="Zoom in">+</button>
        <span class="sep"></span>
        <span class="spl">Speed</span>
        <input type="range" class="spd" min="2" max="30" step="0.5" aria-label="Rotation speed">
        <button type="button" class="play" aria-label="Toggle auto-rotate"></button>
      </div>`;

    const $ = q => this.root.querySelector(q);
    this.stage = $('.stage'); this.wrap = $('.wrap'); this.loader = $('.loader');
    this.meter = $('.meter i'); this.hint = $('.hint');
    this.btnPlay = $('.play'); this.slider = $('.spd');
    if (this.hasAttribute('no-hint')) this.hint.style.display = 'none';   // ምናሌው የራሱ መመሪያ አለው
    if (this.hasAttribute('no-speed')) {                                  // የፍጥነት ተንሸራታቹን መደበቅ
      this.root.querySelectorAll('.sep,.spl,.spd').forEach(e => e.style.display = 'none');
      this.root.querySelector('.bar').classList.add('compact');
    }
    // no-controls: ሁሉንም አዝራሮች መደበቅ — ማጉላት በእጅ (መቆንጠጥ፣ ሁለቴ መንካት) ብቻ
    if (this.hasAttribute('no-controls')) this.root.querySelector('.bar').style.display = 'none';
    // seam: ዙር ያልዘጋ ቪዲዮ ወደ አንድ አቅጣጫ ብቻ እንዲሽከረከር መጨረሻውን ከመጀመሪያው ጋር ያዋህዳል (የፍሬሞች ብዛት)
    this.seam = parseInt(this.getAttribute('seam'), 10) || 0;

    this.stage.style.setProperty('--ar', this.getAttribute('aspect') || '1/1');
    this.stage.setAttribute('aria-label', this.getAttribute('label') || '360 degree food view');

    // ቅንብሮችን ከ attributes ማንበብ
    this.speed   = parseFloat(this.getAttribute('speed')) || 8;     // ሰከንድ / ዙር
    this.sens    = parseFloat(this.getAttribute('sensitivity')) || 1;
    this.maxZoom = parseFloat(this.getAttribute('max-zoom')) || 3;
    // ማስታወሻ፦ `dir` የ HTMLElement አብሮ-የተሰራ ስም ስለሆነ `sign` ተጠቅመናል
    this.sign    = this.hasAttribute('reverse') ? -1 : 1;
    // pingpong: ቪዲዮው ዙር ካልዘጋ ወደፊት እና ወደኋላ እየተመላለሰ ይጫወታል (ዝላይ አይኖርም)
    this.pp      = this.hasAttribute('pingpong');
    // ተጠቃሚው እንቅስቃሴ መቀነስ ከመረጠ በራስ መሽከርከር አይጀምርም
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.auto = this.hasAttribute('autorotate') && !calm;

    this.pos = 0;          // ዒላማ ቦታ (ክፍልፋይ ፍሬም)
    this.rpos = 0;         // በስክሪን ላይ የሚታየው ቦታ — ወደ pos ቀስ ብሎ ይደርሳል (ለስላሳ እንዲሆን)
    this.vel = 0;          // የመጎተት ፍጥነት (ፍሬም/ms) — ለ inertia
    this.dragging = false;
    this.idleUntil = 0;    // ከመጎተት በኋላ በራስ ማሽከርከር የሚቀጥልበት ሰዓት
    this.shown = new Set();
    this.z = { s: 1, tx: 0, ty: 0 };   // የማጉላት ሁኔታ: መጠን እና መገኛ
    this.zt = null;                    // ለስላሳ ማጉላት ዒላማ { s, cx, cy }

    this._bind();
    this._syncUI();
    this._load();
  }

  disconnectedCallback() { cancelAnimationFrame(this.raf); }

  /* ---------- ምስሎችን መሰብሰብ ---------- */
  _sources() {
    // በ JS የተሰጠ የምስል ዝርዝር (data URI ወይም አድራሻ) ቅድሚያ ይሰጠዋል
    if (Array.isArray(this.sources) && this.sources.length) return this.sources;
    const list = this.getAttribute('images');
    if (list) return list.split(',').map(s => s.trim()).filter(Boolean);
    const pattern = this.getAttribute('pattern');
    const n = parseInt(this.getAttribute('frames'), 10) || 10;
    if (pattern) {
      return Array.from({ length: n }, (_, i) => pattern
        .replace('{nn}', String(i + 1).padStart(2, '0'))
        .replace('{n}', i + 1));
    }
    return this._placeholders(n); // ለሙከራ ብቻ
  }

  // ምስል ሳይኖር ለመሞከር የሚሆኑ በ SVG የተሳሉ ጊዜያዊ ፍሬሞች
  _placeholders(n) {
    return Array.from({ length: n }, (_, i) => {
      const a = (i / n) * Math.PI * 2;
      const x = 300 + Math.cos(a) * 90, y = 300 + Math.sin(a) * 28;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
        <ellipse cx="300" cy="330" rx="230" ry="95" fill="#e9e6df"/>
        <ellipse cx="300" cy="320" rx="190" ry="72" fill="#fff"/>
        <ellipse cx="${x}" cy="${y + 285}" rx="70" ry="34" fill="#b5502d"/>
        <circle cx="${600 - x}" cy="${620 - y}" r="16" fill="#f2c14e"/></svg>`;
      return 'data:image/svg+xml,' + encodeURIComponent(svg);
    });
  }

  /* ---------- ቅድመ-መጫን (preload) ---------- */
  async _load() {
    const srcs = this._sources();
    this.N = srcs.length;
    if (this.seam && this.N <= this.seam * 2 + 2) this.seam = 0;   // ፍሬሞች ጥቂት ከሆኑ አይተገበርም
    if (this.N < 2) { this.loader.textContent = 'Add at least 2 images.'; return; }
    // ባለ ሁለት ደረጃ መጫን፦ መጀመሪያ እያንዳንዱን 3ኛ ፍሬም ብቻ (ፈጣን)፣ የቀሩት ከበስተጀርባ ይጫናሉ
    const ST = 3, NN = this.N; let done = 0;
    const all = srcs.map((_, i) => i), first = all.filter(i => i % ST === 0), rest = all.filter(i => i % ST !== 0);
    const fr = srcs.map(() => { const im = new Image(); im.alt = ''; im.draggable = false; return im; });
    const good = new Array(NN).fill(false);
    // አንድ ምስል ሲወድቅ እስከ 5 ጊዜ ደግሞ ይሞክራል
    const fetchOne = src => new Promise(res => {
      let tries = 0;
      const go = () => { const t = new Image(); t.onload = () => res(true);
        t.onerror = () => { if (++tries < 5) setTimeout(go, 500 * tries); else res(false); };
        t.src = src; };
      go();
    });
    // በአንድ ጊዜ የሚጫኑትን ብዛት መገደብ (ኔትዎርኩ እንዳይታነቅ)
    const pool = async (idxs, limit, fn) => { let k = 0;
      await Promise.all(Array.from({ length: limit }, async () => { while (k < idxs.length) await fn(idxs[k++]); })); };
    await pool(first, 6, async i => {
      good[i] = await fetchOne(srcs[i]);
      if (good[i]) fr[i].src = srcs[i];
      this.meter.style.width = (++done / first.length * 100) + '%';
    });
    // ገና ያልደረሱ ፍሬሞች ከቅርቡ ጥሩ ፍሬም ምስል ይዋሳሉ (ጥቁር እንዳይታይ)
    const nearest = i => { for (let d = 0; d < NN; d++) for (const j of [i - d, i + d]) { const k = ((j % NN) + NN) % NN; if (good[k]) return k; } return 0; };
    for (let i = 0; i < NN; i++) if (!good[i]) fr[i].src = srcs[nearest(i)];
    this.frames = fr;
    this.frames.forEach(img => this.wrap.appendChild(img));
    // የቀሩት ፍሬሞች ከበስተጀርባ ይጫናሉ፣ ሲደርሱ ቦታቸውን ይይዛሉ
    pool(rest, 3, async i => { if (await fetchOne(srcs[i])) { good[i] = true; fr[i].src = srcs[i]; } });
    this.loader.classList.add('done');
    this.last = performance.now();
    this.raf = requestAnimationFrame(t => this._tick(t));
  }

  /* ---------- የተጠቃሚ ግብዓት ---------- */
  _bind() {
    const s = this.stage, P = new Map();           // ንቁ ጣቶች/ጠቋሚዎች
    let lastX = 0, lastT = 0, moved = 0, tapT = 0, pinch = null;
    const rel = e => { const r = s.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    const bump = () => { this.idleUntil = performance.now() + 2000; };  // ከ2 ሰከንድ በኋላ እንደገና ይዞራል

    s.addEventListener('pointerdown', e => {
      s.setPointerCapture(e.pointerId);
      P.set(e.pointerId, rel(e));
      this.hint.classList.add('hide');
      this.zt = null;
      if (P.size === 1) {
        this.dragging = true; this.vel = 0; moved = 0;
        lastX = e.clientX; lastT = e.timeStamp;
        s.classList.add('drag');
      } else if (P.size === 2) {
        // ሁለት ጣት: መቆንጠጥ (pinch) ይጀምራል፣ መሽከርከር ይቆማል
        this.dragging = false;
        const [a, b] = [...P.values()];
        const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, z0: this.z.s,
                  p0: { x: (mid.x - this.z.tx) / this.z.s, y: (mid.y - this.z.ty) / this.z.s } };
      }
    });

    s.addEventListener('pointermove', e => {
      if (!P.has(e.pointerId)) return;
      const prev = P.get(e.pointerId), cur = rel(e);
      P.set(e.pointerId, cur);

      if (P.size === 2 && pinch) {
        // የሁለቱ ጣቶች ርቀት መጠኑን፣ መሃላቸው መገኛውን ይወስናል
        const [a, b] = [...P.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        const ns = clamp(pinch.z0 * d / pinch.d0, 1, this.maxZoom);
        this.z.s = ns; this.z.tx = mid.x - pinch.p0.x * ns; this.z.ty = mid.y - pinch.p0.y * ns;
        this._applyZoom();
        return;
      }
      if (!this.dragging) return;

      const dx = e.clientX - lastX, dt = Math.max(1, e.timeStamp - lastT);
      moved += Math.abs(dx) + Math.abs(cur.y - prev.y);
      // የስፋቱ መጎተት = አንድ ሙሉ ዙር (N ፍሬሞች)
      const df = (dx / s.clientWidth) * this.N * this.sens * this.sign;
      this.pos -= df;
      this.vel = 0.8 * this.vel + 0.2 * (-df / dt);                 // ለስላሳ ፍጥነት
      this.vel = clamp(this.vel, -0.02, 0.02);                      // ከመጠን በላይ ፍጥነት እንዳይኖር ገደብ
      if (this.z.s > 1) { this.z.ty += cur.y - prev.y; this._applyZoom(); } // ሲጎላ ወደ ላይ/ታች ማንቀሳቀስ
      lastX = e.clientX; lastT = e.timeStamp;
    });

    const end = e => {
      if (!P.has(e.pointerId)) return;
      const p = rel(e);
      P.delete(e.pointerId);
      if (pinch) {                       // መቆንጠጥ አብቅቷል
        if (P.size < 2) { pinch = null; this.dragging = false; s.classList.remove('drag'); bump(); }
        return;
      }
      if (!this.dragging) return;
      this.dragging = false; s.classList.remove('drag'); bump();
      // ሁለቴ መንካት: አጉላ ↔ መልስ
      if (moved < 6) {
        if (e.timeStamp - tapT < 300) {
          this.vel = 0; tapT = 0;
          this._zoomTo(this.z.s > 1.05 ? 1 : Math.min(2, this.maxZoom), p.x, p.y);
        } else tapT = e.timeStamp;
      }
    };
    s.addEventListener('pointerup', end);
    s.addEventListener('pointercancel', end);

    // Ctrl + ዊል (ወይም የ trackpad መቆንጠጥ) ማጉላት
    s.addEventListener('wheel', e => {
      if (!(e.ctrlKey || e.metaKey)) return;     // መደበኛ ስክሮል ገጹን እንዳይከለክል
      e.preventDefault();
      const p = rel(e);
      this._zoomTo((this.zt ? this.zt.s : this.z.s) * Math.exp(-e.deltaY * 0.01), p.x, p.y);
    }, { passive: false });

    // የቀስት ቁልፎች እና + / −
    s.addEventListener('keydown', e => {
      const c = { x: s.clientWidth / 2, y: s.clientHeight / 2 };
      if (e.key === 'ArrowLeft')  { this.pos -= 1; bump(); e.preventDefault(); }
      if (e.key === 'ArrowRight') { this.pos += 1; bump(); e.preventDefault(); }
      if (e.key === '+' || e.key === '=') this._zoomBy(1.4, c);
      if (e.key === '-') this._zoomBy(1 / 1.4, c);
    });

    // አዝራሮች እና የፍጥነት ተንሸራታች
    const c = () => ({ x: s.clientWidth / 2, y: s.clientHeight / 2 });
    this.root.querySelector('.zin').addEventListener('click',  () => this._zoomBy(1.4, c()));
    this.root.querySelector('.zout').addEventListener('click', () => this._zoomBy(1 / 1.4, c()));
    this.btnPlay.addEventListener('click', () => { this.auto = !this.auto; this._syncUI(); });
    this.slider.addEventListener('input', () => {
      this.speed = 60 / parseFloat(this.slider.value);     // ተንሸራታቹ = ዙር በደቂቃ
      if (!this.auto) { this.auto = true; this._syncUI(); }
    });

    // ገጹ ሲደበቅ እንቅስቃሴው ይቆማል (ባትሪ ለመቆጠብ)
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) cancelAnimationFrame(this.raf);
      else if (this.frames && this.isConnected) { this.last = performance.now(); this.raf = requestAnimationFrame(t => this._tick(t)); }
    });
  }

  _syncUI() {
    this.btnPlay.textContent = this.auto ? '❚❚' : '▶';
    this.btnPlay.setAttribute('aria-pressed', String(this.auto));
    this.slider.value = clamp(60 / this.speed, 2, 30);
  }

  /* ---------- ማጉላት ---------- */
  // ዒላማ መጠን ላይ ለስላሳ በሆነ መንገድ እንዲደርስ ያዛል (በ _tick ውስጥ ይሄዳል)
  _zoomTo(s, cx, cy) { this.zt = { s: clamp(s, 1, this.maxZoom), cx, cy }; }
  _zoomBy(f, c) { this._zoomTo((this.zt ? this.zt.s : this.z.s) * f, c.x, c.y); }

  // በ (cx, cy) ነጥብ ዙሪያ መጠኑን ወደ ns ይቀይራል — ነጥቡ ባለበት ይቆያል
  _zoomAt(cx, cy, ns) {
    const z = this.z, px = (cx - z.tx) / z.s, py = (cy - z.ty) / z.s;
    z.s = ns; z.tx = cx - px * ns; z.ty = cy - py * ns;
    this._applyZoom();
  }

  // ምስሉ ከመድረኩ ውጪ እንዳይወጣ መገደብ እና መተግበር
  _applyZoom() {
    const z = this.z, w = this.stage.clientWidth, h = this.stage.clientHeight;
    z.tx = clamp(z.tx, w - w * z.s, 0);
    z.ty = clamp(z.ty, h - h * z.s, 0);
    this.wrap.style.transform = `translate(${z.tx}px,${z.ty}px) scale(${z.s})`;
    this.stage.classList.toggle('zoomed', z.s > 1.001);
    this.dispatchEvent(new CustomEvent('zoom', { detail: z.s }));   // ምናሌው ግብአቶችን እንዲያሳይ/እንዲደብቅ
  }

  /* ---------- የእንቅስቃሴ ዑደት ---------- */
  _tick(now) {
    if (!this.isConnected) return;   // ከገጹ ከተወገደ ዑደቱ ይቆማል
    const dt = Math.min(64, Math.max(0, now - this.last)); this.last = now;

    if (!this.dragging) {
      if (Math.abs(this.vel) > 0.00005) {
        // ከጎተቱ በኋላ ቀስ በቀስ የሚቆም ፍጥነት (inertia)
        this.pos += this.vel * dt;
        this.vel *= Math.exp(-dt / 350);
